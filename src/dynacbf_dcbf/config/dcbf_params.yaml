# =============================================================================
# dcbf_params.yaml
# =============================================================================
# 【来源】本文件的 `/**` 段落是参考实现（另一套已在本机验证跑通的 ROS 2 复现）
#         local_planner/config/config.yaml 的**逐字复制**：键名、取值、注释一字未改。
#         末尾用注释块分隔出"我们新增的融合缝参数"。
#
# 【顶层键用 /** 的原因】参考实现本来就用 `/**`（对所有节点生效）。本 launch 里三个
#   节点共用这一个文件：local_planner_node / controller_node / bspline_path_sampler。
#   ROS 2 对参数文件中"节点未声明"的键是忽略（不报错），所以：
#     * 参考实现的算法参数只有 local_planner_node 会真正读到；
#     * 末尾的融合缝参数只有 bspline_path_sampler 会读到。
#
# 【三条必须满足的对接前提（供审阅/排障）】
#   1) kalman_N 必须等于 MPC_N（local_planner.py 的 __load_parameter 里有硬校验，
#      不等就直接抛异常）。更关键的是 obs_predict_pub 的**发布方**必须满足布局契约：
#        * 整条 Float32MultiArray 的长度必须能被 5 整除（每步 5 个数
#          [cx, cy, a, b, phi]）；
#        * 按"障碍物优先"排布：第 j 条障碍物的第 i 步在下标 j*kalman_N + i，
#          即**每条障碍物必须恰好提供 kalman_N 步**；
#        * 步与步的时间间隔必须等于 MPC_step_size (0.25 s)，否则 D-CBF 约束会
#          作用在错误时刻的障碍物位置上。
#      【风险提示】逐字复制的 local_planner.py 里只有 `len(data) % 5 == 0` 这一道
#      检查，之后直接用 `num_obs = int(len(obstacles) / kalman_N)` 切分。若发布方
#      每条障碍物只给 16 步（例如 tracking.yaml 的 prediction_horizon=15、dt=0.1），
#      则 num_obs = int(n*16/25)：n=1 时为 0 —— **等于完全没有 CBF 约束**（静默失效），
#      n=2 及更多时会把相邻障碍物的步错位当成同一条障碍物的预测。
#      因此必须让预测发布方的 (每条步数, dt) 与 (kalman_N, MPC_step_size) 对齐。
#   2) global_path 由 bspline_path_sampler 提供：它把 planning/bspline 的 B 样条按
#      **弧长**几何采样后发布到同名话题（详见该文件顶部注释）。
#   3) controller_node 需要 TF 'map' → 'base_link' 才能发布 curr_state；
#      没有这条 TF 时它静默跳过，local_planner_node 收不到 curr_state 就完全不动作。
# =============================================================================

/**:
  ros__parameters:
    replan_period: 0.1
    # HiveCore全向底盘合速度上限：sqrt(vx^2 + vy^2) <= 1.0 m/s。
    v_max: 1.0
    # v_min 保留为兼容参数；全向模型不施加前向最低速度。
    v_min: 0.0
    omega_max: 1.25

    # Three-component body-frame initial controls: [vx, vy, omega].
    # init_v_* remains the backward-compatible vx parameter; init_vy_* is lateral.

    MPC_N: 25
    MPC_step_size: 0.25

    # 【真机机身】障碍椭圆偏置 = 机体朝向相关半径 + safe_dist。
    # 机体用平滑超椭圆(squircle)表示，前/后/侧不同，保守包住实测
    # 0.94m长×0.49m宽机身（参考基座 base_link，前后缘由测量+真实TF得出）。
    # barrier.py 的 ellipse_barrier 按“障碍→机器人”方向在机体坐标系取半径。
    # 数值经数值验证：squircle 各方向均 ≥ 碰撞胶囊，且平滑可导（供 MPC/IPOPT）。
    # 前半径(相对 base_link)： front 0.386+余量 → 0.73（含胶囊半径 0.28+0.02 包络）
    # 后半径：                  rear  0.552+余量 → 0.89
    # 侧半径（半宽 0.243+余量):                     → 0.30
    robot_a_front: 0.73
    robot_a_rear: 0.89
    robot_b: 0.30
    robot_p: 4.0

    # 附加安全余量（旧 safe_dist=0.3 是"圆盘机身半径"；现机身由上面 squircle 承担，
    # 此值仅作跟踪/TF 误差的冗余余量）。须 >0。
    safe_dist: 0.1
    gamma_k: 0.3
    goal_tolerance: 0.1

    kalman_N: 25

    MPC_constraint: "CBF"  #    None Euclidean CBF

    # Hot-start warm solve makes multiple explicit initial guesses unnecessary.
    init_N: 1

    init_v_0: 0.01
    init_vy_0: 0.0
    init_omega_0: 0.3

    init_v_1: 0.01
    init_vy_1: 0.0
    init_omega_1: -0.3

    # -------------------------------------------------------------------------
    # 以下为**我们新增**的融合缝参数（bspline_path_sampler），
    # 不属于参考实现的 config.yaml；上面的键与取值一字未改。
    # -------------------------------------------------------------------------

    # 输入：规划层发布的名义 B 样条话题（dynacbf_msgs/Bspline）
    bspline_topic: planning/bspline

    # 输出：参考实现 local_planner.py 订阅的参考路径话题。用同名 global_path，
    # 因此三个节点之间**不需要任何 remap**。
    out_topic: global_path

    # B 样条与输出 Path 的坐标系。真机统一用甲方全局 frame "map"（map_frame），
    # 与 controller / bspline / planner / local_map 一致；不再使用仿真残留的 "world"。
    frame_id: map

    # 每次采样输出的路点数。必须 >= MPC_N（25），否则 MPC 的参考窗被截短。
    path_points: 120

    # 弧长步长 [m]。**标定要点**：参考实现发布参考路径的
    # global_path_publisher.cpp 用的间距是 0.1 m，而 MPC_step_size = 0.25 s，
    # 即参考实现的"隐含参考速度"约 0.4 m/s（v_max = 0.5）。
    # 若取 0.05 m，参考窗每步只前进 0.05 m，而机器人 0.25 s 内能走 0.125 m，
    # 跟踪代价会把车速拖到约 0.2 m/s（比参考实现慢一倍）。
    # 要复现参考实现的速度表现，请把本值改为 0.1。
    arc_step: 0.1

    # 位姿来源：取"机器人在曲线上的最近点"作为当前进度 s_now 必须知道机器人在哪。
    # 用 body_pose（nav_msgs/Odometry，SensorDataQoS），与 tracking/controller 同源。
    odom_topic: body_pose

    # 是否在 body_pose 更新、且进度前进 >= arc_step 时刷新采样窗。
    # 开启后，即使规划层长时间不重规划，参考窗也会跟着机器人前进（不会"用光"）。
    resample_on_odom: true
