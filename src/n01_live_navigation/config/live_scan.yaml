# Live vendor SLAM -> SCAN adapter defaults.
# The bridge waits briefly for scan-time TF but never substitutes latest TF.
# The original scan timestamp and max_cloud_age_s remain strict freshness gates.
# use_sim_time must remain false for live sensors.
n01_live_scan_bridge:
  ros__parameters:
    use_sim_time: false
    status_topic: /localization_status
    status_type: hivecore_slam3d/msg/LocalizationStatus
    cloud_topic: /livox/lidar/geo_filtered
    pose_topic: /robot_pose
    odom_topic: /odom
    odom_frame: odom
    odom_child_frame: base_link
    expected_cloud_frame: lidar_link
    map_frame: map
    body_frame: base_footprint
    max_status_age_s: 1.0
    max_pose_rx_age_s: 0.7
    max_pose_stamp_age_s: 0.7
    max_pose_anchor_delta_s: 0.5
    pose_cache_size: 64
    max_odom_rx_age_s: 0.2
    max_odom_stamp_age_s: 0.4
    odom_interpolation_max_gap_s: 0.08
    odom_cache_size: 512
    max_cloud_age_s: 0.6
    max_latest_scan_lag_s: 0.45
    body_pose_publish_period_s: 0.05
    max_live_body_pose_age_s: 0.25
    max_tf_wait_s: 0.45
    tf_retry_period_s: 0.02
    max_pending_clouds: 1
    max_points: 100000
    max_point_range_m: 12.0
