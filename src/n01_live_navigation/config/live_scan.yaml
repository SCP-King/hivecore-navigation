# Live vendor SLAM -> SCAN adapter defaults.
# The bridge waits briefly for scan-time TF but never substitutes latest TF.
# The original scan timestamp and max_cloud_age_s remain strict freshness gates.
# use_sim_time must remain false for live sensors.
n01_live_scan_bridge:
  ros__parameters:
    use_sim_time: false
    status_topic: /localization_status
    status_type: hivecore_slam3d/msg/LocalizationStatus
    cloud_topic: /livox/lidar/geo_filtered
    expected_cloud_frame: lidar_link
    map_frame: map
    body_frame: base_link
    max_status_age_s: 1.0
    max_cloud_age_s: 0.6
    max_tf_wait_s: 0.45
    tf_retry_period_s: 0.02
    max_pending_clouds: 8
    max_points: 100000
    max_point_range_m: 12.0
