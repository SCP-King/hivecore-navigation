# Backend-neutral N-01 -> SCAN adapter defaults.
# The bridge waits briefly for scan-time TF but never substitutes latest TF.
# The original scan timestamp and max_cloud_age_s remain strict freshness gates.
# use_sim_time must remain false for live sensors.
n01_live_scan_bridge:
  ros__parameters:
    use_sim_time: false
    status_topic: /n01/localization/status
    cloud_topic: /livox/lidar/geo_filtered
    pose_topic: /n01/localization/pose
    odom_topic: /odom
    odom_frame: odom
    odom_child_frame: base_link
    expected_cloud_frame: lidar_link
    map_frame: map
    # /robot_pose input stays map<-base_link (vendor SLAM contract).
    body_frame: base_link
    # /body_pose output for SCAN/tracker is the physical body frame.
    planner_body_frame: base_link
    max_status_age_s: 1.0
    max_pose_rx_age_s: 0.7
    max_pose_stamp_age_s: 5.0
    max_pose_anchor_delta_s: 5.0
    max_live_body_pose_anchor_delta_s: 5.0
    # Short outages use measured odometry, not constant-speed extrapolation.
    # Limit travel as well as age; high speeds cannot coast for the full 5 s.
    prediction_max_distance_m: 0.12
    prediction_max_turn_rad: 0.20
    pose_correction_time_s: 0.8
    pose_correction_speed_mps: 0.04
    pose_correction_yaw_rate_radps: 0.08
    pose_correction_jump_m: 0.15
    pose_correction_jump_rad: 0.17
    pose_cache_size: 64
    max_odom_rx_age_s: 0.2
    max_odom_stamp_age_s: 0.4
    odom_interpolation_max_gap_s: 0.08
    odom_cache_size: 512
    max_cloud_age_s: 0.9
    max_latest_scan_lag_s: 0.7
    body_pose_publish_period_s: 0.05
    max_live_body_pose_age_s: 0.4
    # /body_pose may use the latest real TF sample up to 150 ms behind /odom.
    # The output stamp follows that TF sample; scan-time deskew remains exact.
    max_live_tf_lag_s: 0.15
    max_tf_wait_s: 0.55
    tf_retry_period_s: 0.02
    max_pending_clouds: 1
    max_points: 100000
    max_point_range_m: 12.0
