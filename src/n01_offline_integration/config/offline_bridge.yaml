n01_offline_sensor_bridge:
  ros__parameters:
    # Online/read-only integration target: Hive2 motion stack +0.90m.
    # Do not apply this authority gate to the original Bag map's SLAM +0.30m.
    # Historical mapping replay uses n01_historical_bag with an explicit profile.
    # Real SLAM status wire fields verified from installed LocalizationStatus.msg.
    # Still FAIL-CLOSED unless independent live TF publication evidence is checked.
    # This config is NOT a live robot authorization.
    fixture_mode: false
    input_cloud_topic: /livox/lidar/geo_filtered
    input_frame: lidar_link
    target_frame: map
    body_frame: base_link
    status_topic: /localization_status
    status_type: hivecore_slam3d/msg/LocalizationStatus
    outer_path: control_signal_outer_role
    inner_path: control_signal_session_mode
    tf_flag_path: registration_output_tf_published
    outer_value: localization
    inner_value: tracking
    status_timeout_s: 1.0
    tf_timeout_s: 0.05
    max_cloud_points: 300000
    # Never set true just because /tf_static contains one +0.90m sample.
    # First run scripts/n01_live_localization_readonly_audit.py while stationary;
    # if conflicting TF edges are detected, change vendor launch/RSP ownership,
    # not the acceptance flag. This boolean by itself proves no author identity.
    slam_rsp_disabled_confirmed: false
    use_sim_time: false
