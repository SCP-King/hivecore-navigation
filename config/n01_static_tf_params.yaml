# N-01 override for hivecore_cloud_preprocessor/static_tf_publisher_node.
# YAML provides startup tilt; live IMU updates it through the vendor calibration.
# Project calibration is explicitly shared by preprocess and SLAM frontends.
# Seed from 5586 raw stationary IMU samples on 2026-11-12; median gravity attitude.
# Raw roll noise std=0.454deg; the live complementary filter remains responsible for smoothing.
# Relative yaw remains zero. The preprocessor applies this tilt exactly once.
static_tf_publisher_node:
  ros__parameters:
    lidar_imu:
      parent_frame: "lidar_link"
      child_frame: "imu_link"
      translation_x: 0.0
      translation_y: 0.0
      translation_z: 0.0
      use_rpy: true
      orientation_in_degrees: true
      roll: -0.838236
      pitch: 10.326584
      yaw: 0.000000
      rotation_x: 0.0
      rotation_y: 0.0
      rotation_z: 0.0
      rotation_w: 1.0

    imu_livox:
      parent_frame: "imu_link"
      child_frame: "livox_frame"
      translation_x: 0.0
      translation_y: 0.0
      translation_z: 0.0
      use_rpy: true
      orientation_in_degrees: true
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
      rotation_x: 0.0
      rotation_y: 0.0
      rotation_z: 0.0
      rotation_w: 1.0

    orientation_topic: "/imu/rpy/filtered"
    enable_publish: true
    auto_calibrate_from_topic: true
    calibration_threshold_deg: 0.25
    calibration_min_interval_sec: 30.0
    calibration_stable_samples: 50
    orientation_timeout_sec: 3.0
    exit_on_orientation_timeout: false
