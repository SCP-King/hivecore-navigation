name: G4 offline pure-Python contracts
on:
  push:
    paths:
      - 'scripts/n01_collect_planning_readiness_audit.sh'
      - 'scripts/deploy_n01_planning_fixes.sh'
      - 'scripts/lib/ros_env.sh'
      - 'scripts/lib/colcon_build_guard.sh'
      - 'scripts/test_colcon_build_guard.sh'
      - 'scripts/run_n01_live_stack_preflight.sh'
      - 'scripts/test_ros_env_compat.sh'
      - 'scripts/n01_environment_preflight.sh'
      - 'scripts/build_n01_fast_lio2.sh'
      - 'scripts/run_n01_fast_lio2_bag.sh'
      - 'docs/n01_development_environment.md'
      - 'docs/n01_four_stage_navigation_delivery.md'
      - 'src/n01_live_navigation/n01_live_navigation/planning_smoke_test.py'
      - 'src/scan_planner/plan_env/**'
      - 'scripts/n01_live_planning_ros_probe.py'
      - 'scripts/n01_live_stack_preflight.py'
      - 'scripts/README.md'
      - 'docs/n01_planning_readiness_audit.md'
      - 'scripts/n01_g4_bag_start_preflight.py'
      - 'scripts/run_n01_g4_full_chain.sh'
      - 'src/n01_offline_integration/**'
      - 'config/reference/hive2_wheel_only_tf_contract_20261030.json'
      - 'config/reference/hive2_robot_motion_audit_20261030.json'
      - 'src/n01_bringup/config/n01_sensor.yaml'
      - 'src/n01_bringup/launch/sensor_only.launch.py'
      - 'n01_fast_lio2.repos'
      - 'scripts/import_n01_fast_lio2.sh'
      - 'scripts/patch_n01_fast_lio2.py'
      - 'scripts/build_n01_fast_lio2.sh'
      - 'scripts/n01_fast_lio_bag_preflight.py'
      - 'scripts/run_n01_fast_lio2_bag.sh'
      - 'src/n01_fast_lio/**'
      - 'src/n01_live_navigation/**'
      - 'docs/n01_live_scan_integration.md'
      - 'docs/n01_fast_lio2_integration.md'
      - 'src/n01_offline_integration/test/test_fast_lio2_integration_contract.py'
      - '.github/workflows/g4-offline-contract.yml'
  workflow_dispatch:

jobs:
  research-contracts-only:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Static Bash syntax (never launch ROS or control)
        run: |
          bash -n scripts/run_n01_g4_full_chain.sh
          bash -n scripts/run_n01_bag_functional.sh
      - name: N-01 deploy, smoke-test and static-inflation validation
        run: |
          bash -n scripts/lib/ros_env.sh
          bash -n scripts/lib/colcon_build_guard.sh
          bash -n scripts/test_colcon_build_guard.sh
          bash -n scripts/run_n01_live_stack_preflight.sh
          bash scripts/test_colcon_build_guard.sh
          bash -n scripts/test_ros_env_compat.sh
          bash -n scripts/n01_environment_preflight.sh
          bash -n scripts/deploy_n01_planning_fixes.sh
          bash -n scripts/build_n01_fast_lio2.sh
          bash -n scripts/run_n01_fast_lio2_bag.sh
          bash scripts/test_ros_env_compat.sh
          bash -n scripts/deploy_n01_planning_fixes.sh
          python3 -m py_compile src/n01_live_navigation/n01_live_navigation/planning_smoke_test.py
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/scan_planner/plan_env/include \
            src/scan_planner/plan_env/test/test_static_inflation.cpp \
            -o /tmp/test_static_inflation
          /tmp/test_static_inflation
      - name: N-01 live preflight import failures remain valid JSON without ROS
        run: |
          set +e
          python3 -S scripts/n01_live_stack_preflight.py > /tmp/n01_live_preflight_import.json 2> /tmp/n01_live_preflight_stderr.txt
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          with open("/tmp/n01_live_preflight_import.json", encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["schema"] == "n01.live_stack_preflight_import_error.v1"
          assert report["status"] == "ROS_PYTHON_IMPORT_FAILED"
          assert report["import_stage"] == "rclpy"
          PY
          test ! -s /tmp/n01_live_preflight_stderr.txt
      - name: N-01 planning-readiness audit syntax (no ROS runtime or commands)
        run: |
          bash -n scripts/n01_collect_planning_readiness_audit.sh
          python3 -m py_compile scripts/n01_live_planning_ros_probe.py scripts/n01_live_stack_preflight.py
      - name: N-01 diagnostic entrypoint inventory (single supported planning audit)
        run: |
          test -f scripts/n01_collect_planning_readiness_audit.sh
          test -f scripts/n01_live_stack_preflight.py
          test -f scripts/n01_live_planning_ros_probe.py
          test ! -e scripts/n01_capture_planning_blockers.sh
          test ! -e scripts/n01_collect_pose_goal_diagnostics.sh
          test ! -e scripts/n01_collect_full_runtime_diagnostics.sh
      - name: Hive2 29-frame four-wheel steer and fixed-pitch source contract
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_wheel_only_tf_contract.py' -v
      - name: Hive2 authoritative wheel motion YAML audit and G3 mismatch contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_hive2_robot_motion_audit.py' -v
      - name: G3.3 Hive2 source-matched trajectory necessary-constraint screening
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g33_hive2_wheel_screen.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g3_mpc_cbf.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g3_frame_evidence.py' -v
      - name: G3.4 acceleration-bounded candidate generation and fail-closed screening
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g34_bounded_generation.py' -v
      - name: G3.5 CBF hypothesis-vs-intervention attribution contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g35_cbf_attribution.py' -v
      - name: G4.8 real Bag start and fail-closed goal selection unit tests
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_bag_anchored_goal.py' -v
      - name: G4.9 surface-height evidence only (never assume ground)
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_pcd_route_height_profile.py' -v
      - name: G4.10 PCD surface ambiguity review without guessed floor
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g410_route_surface_ambiguity.py' -v
      - name: G4.11 real SCAN mode3 height semantics vs Bag reconstructed body pose
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g411_mode3_z_alignment.py' -v
      - name: G4.12 mapping-vs-Hive2 TF mount reconciliation read-only contract
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g412_historical_mount_alignment.py' -v
      - name: G4.13 old-map alignment and live read-only localization probes
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g413_historical_mapping_and_live_readonly.py' -v
          bash -n scripts/run_n01_g4_full_chain.sh
          bash -n scripts/run_n01_bag_functional.sh
      - name: Dual SLAM backend preserves vendor interface and isolates FAST-LIO2
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_dual_slam_backend.py' -v
      - name: G4.15 native SCAN static PCD map load and G4 readiness feature smoke
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g415_native_scan_static_pcd.py' -v
      - name: G4.3 PCD/Bag conflict and A* contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_pcd_bag_evidence_audit.py' -v
      - name: G4.4-7 reference/chain contracts
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g4_scan_reference.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g4_chain_evidence.py' -v
      - name: Check standalone G4.8 script syntax (no rosbag2 import)
        run: python3 -m py_compile scripts/n01_g4_bag_start_preflight.py
      - name: FAST-LIO2 isolated backend and vendor interface contract
        run: |
          bash -n scripts/import_n01_fast_lio2.sh
          bash -n scripts/build_n01_fast_lio2.sh
          bash -n scripts/run_n01_fast_lio2_bag.sh
          python3 -m py_compile scripts/patch_n01_fast_lio2.py scripts/n01_fast_lio_bag_preflight.py src/n01_fast_lio/launch/fast_lio_mapping.launch.py
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_fast_lio2_integration_contract.py' -v

      - name: Install NumPy for live bridge pure-Python contracts
        run: python3 -m pip install --user numpy
      - name: Live navigation Python syntax
        run: |
          python3 -m py_compile src/n01_live_navigation/n01_live_navigation/core.py src/n01_live_navigation/n01_live_navigation/live_scan_bridge.py src/n01_live_navigation/n01_live_navigation/goal_gate.py src/n01_live_navigation/n01_live_navigation/runtime_supervisor.py src/n01_live_navigation/n01_live_navigation/dynamic_obstacle_tracker.py src/n01_live_navigation/n01_live_navigation/trajectory_monitor.py src/n01_live_navigation/n01_live_navigation/safety_supervisor.py src/n01_live_navigation/n01_live_navigation/acceptance.py src/n01_live_navigation/launch/live_scan.launch.py src/n01_live_navigation/setup.py src/n01_static_map/n01_static_map/static_map_node.py scripts/n01_live_stack_preflight.py
      - name: Live navigation pure-Python unit and source contracts
        run: PYTHONPATH=src/n01_live_navigation python3 -m unittest discover -s src/n01_live_navigation/test -v
      - name: Live navigation has no actuator publisher
        run: '! grep -R -E "create_publisher.*(cmd_vel|cmd_wheel|rt_command)|create_publisher.*Twist" src/n01_live_navigation/n01_live_navigation'
