name: G4 offline pure-Python contracts
on:
  push:
    paths:
      - 'scripts/n01_g4_bag_start_preflight.py'
      - 'scripts/run_n01_g4_full_chain.sh'
      - 'src/n01_offline_integration/**'
      - 'config/reference/hive2_wheel_only_tf_contract_20261030.json'
      - 'config/reference/hive2_robot_motion_audit_20261030.json'
      - 'src/n01_bringup/config/n01_sensor.yaml'
      - 'src/n01_bringup/launch/sensor_only.launch.py'
      - '.github/workflows/g4-offline-contract.yml'
  workflow_dispatch:

jobs:
  research-contracts-only:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Static Bash syntax (never launch ROS or control)
        run: |
          bash -n scripts/run_n01_g4_full_chain.sh
          bash -n scripts/run_n01_bag_functional.sh
      - name: Hive2 29-frame four-wheel steer and fixed-pitch source contract
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_wheel_only_tf_contract.py' -v
      - name: Hive2 authoritative wheel motion YAML audit and G3 mismatch contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_hive2_robot_motion_audit.py' -v
      - name: G3.3 Hive2 source-matched trajectory necessary-constraint screening
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g33_hive2_wheel_screen.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g3_mpc_cbf.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g3_frame_evidence.py' -v
      - name: G3.4 acceleration-bounded candidate generation and fail-closed screening
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g34_bounded_generation.py' -v
      - name: G3.5 CBF hypothesis-vs-intervention attribution contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g35_cbf_attribution.py' -v
      - name: G4.8 real Bag start and fail-closed goal selection unit tests
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_bag_anchored_goal.py' -v
      - name: G4.9 surface-height evidence only (never assume ground)
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_pcd_route_height_profile.py' -v
      - name: G4.10 PCD surface ambiguity review without guessed floor
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g410_route_surface_ambiguity.py' -v
      - name: G4.11 real SCAN mode3 height semantics vs Bag reconstructed body pose
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g411_mode3_z_alignment.py' -v
      - name: G4.12 mapping-vs-Hive2 TF mount reconciliation read-only contract
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g412_historical_mount_alignment.py' -v
      - name: G4.13 old-map alignment and live read-only localization probes
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g413_historical_mapping_and_live_readonly.py' -v
          bash -n scripts/run_n01_g4_full_chain.sh
          bash -n scripts/run_n01_bag_functional.sh
      - name: G4.15 native SCAN static PCD map load and G4 readiness feature smoke
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g415_native_scan_static_pcd.py' -v
      - name: G4.3 PCD/Bag conflict and A* contracts
        run: python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_pcd_bag_evidence_audit.py' -v
      - name: G4.4-7 reference/chain contracts
        run: |
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g4_scan_reference.py' -v
          python3 -m unittest discover -s src/n01_offline_integration/test -p 'test_g4_chain_evidence.py' -v
      - name: Check standalone G4.8 script syntax (no rosbag2 import)
        run: python3 -m py_compile scripts/n01_g4_bag_start_preflight.py
